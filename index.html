<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2bb3a3">
  <title>ミール・ヘルスケア｜食事管理アプリ</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --ink: #1f2933; --muted: #6b7785;
      --line: #e3e8ee; --brand: #2bb3a3; --brand-d: #1f8f82;
      --good: #2e9e5b; --warn: #d98c17; --bad: #d64545; --info: #3a7bd5;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f151b; --card:#182028; --ink:#e6edf3; --muted:#8b9aa8;
        --line:#28323d; --brand:#2bb3a3; --brand-d:#25a293;
        --shadow: 0 1px 3px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35); }
    }
    :root[data-theme="light"] { --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --muted:#6b7785; --line:#e3e8ee; }
    :root[data-theme="dark"]  { --bg:#0f151b; --card:#182028; --ink:#e6edf3; --muted:#8b9aa8; --line:#28323d; }

    * { box-sizing: border-box; }
    /* iOSのテキスト自動拡大を無効化し、全タブで同じ表示スケールに固定 */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
      -webkit-font-smoothing:antialiased; line-height:1.55;
      overflow-x:hidden; width:100%; }
    #app { max-width: 820px; margin: 0 auto; padding-bottom: 40px; width:100%; overflow-x:hidden; }
    /* 横はみ出し防止（縮小表示の原因を除去） */
    input, select, canvas, img, table { max-width:100%; }
    .row { min-width:0; }
    .row > input, .row > select { min-width:0; flex:0 1 auto; }

    .topbar { display:flex; justify-content:space-between; align-items:center;
      padding:14px 16px; position:sticky; top:0; background:var(--bg); z-index:5; }
    .brand { font-weight:700; font-size:18px; }
    .brand span { background:linear-gradient(90deg,var(--brand),var(--info)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .today { color:var(--muted); font-size:13px; }
    .tb-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
    .user-chip { border:1px solid var(--line); background:var(--card); color:var(--ink);
      border-radius:20px; padding:4px 12px; font-size:12.5px; font-weight:600; cursor:pointer; max-width:46vw;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .user-chip:hover { border-color:var(--brand); }
    .fp-item.sel { border-color:var(--brand); }

    .tabs { display:flex; gap:4px; padding:0 12px; overflow-x:auto; position:sticky; top:52px; background:var(--bg); z-index:4; }
    .tab { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px;
      border:none; background:transparent; color:var(--muted); padding:8px 12px; border-radius:10px;
      font-size:11px; cursor:pointer; border-bottom:2px solid transparent; }
    .tab .ti { font-size:18px; }
    .tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }

    main { padding: 12px; display:flex; flex-direction:column; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
    h2 { margin:0 0 6px; font-size:19px; } h3 { margin:0 0 8px; font-size:15px; }
    .mt { margin-top:18px; }
    .muted { color:var(--muted); font-size:13px; margin:6px 0; }
    .row { display:flex; gap:8px; align-items:center; }
    .row.between { justify-content:space-between; }
    .row.wrap { flex-wrap:wrap; }
    a { color:var(--brand); }

    /* forms */
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:12px 0; }
    label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
    label.block { margin:10px 0; }
    input, select { font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
      background:var(--bg); color:var(--ink); width:100%; }
    input:focus, select:focus { outline:2px solid var(--brand); border-color:transparent; }

    .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 16px;
      border-radius:10px; font-size:14px; cursor:pointer; font-weight:600; transition:.15s; }
    .btn:hover { border-color:var(--brand); }
    .btn.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    .btn.primary:hover { background:var(--brand-d); }
    .btn.sm { padding:7px 12px; font-size:13px; }
    .btn.block { width:100%; margin-top:14px; }
    .btn.ai { border-color:var(--info); color:var(--info); }
    .btn.danger { border-color:var(--bad); color:var(--bad); }

    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge.sm { font-size:10px; padding:1px 7px; margin-left:6px; }
    .badge.good { background:rgba(46,158,91,.15); color:var(--good); }
    .badge.warn { background:rgba(217,140,23,.15); color:var(--warn); }
    .badge.bad  { background:rgba(214,69,69,.15); color:var(--bad); }
    .badge.info { background:rgba(58,123,213,.15); color:var(--info); }

    /* profile result */
    .result-grid, .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin:14px 0; }
    .stat, .kpi { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
    .stat-l, .kpi-l { font-size:12px; color:var(--muted); }
    .stat-v, .kpi-v { font-size:26px; font-weight:700; margin:4px 0; }
    .stat-v small, .kpi-v small { font-size:12px; color:var(--muted); font-weight:400; margin-left:2px; }
    .kpi.good { border-color:var(--good); } .kpi.warn { border-color:var(--warn); } .kpi.bad { border-color:var(--bad); } .kpi.info { border-color:var(--info); }
    .kpi.good .kpi-v { color:var(--good); } .kpi.warn .kpi-v { color:var(--warn); } .kpi.bad .kpi-v { color:var(--bad); } .kpi.info .kpi-v { color:var(--info); }

    /* meals */
    .meals { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-top:10px; }
    .meal { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; }
    .meal-head { display:flex; justify-content:space-between; font-weight:600; margin-bottom:6px; }
    .meal-kcal { color:var(--brand); }
    .items { list-style:none; margin:0 0 8px; padding:0; font-size:13px; }
    .items li { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line); }
    .items button, .chip button, .modal-x { border:none; background:transparent; color:var(--bad); cursor:pointer; font-size:15px; }

    .breakdown { display:flex; flex-wrap:wrap; gap:8px; }
    .breakdown span { background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:13px; }
    .breakdown b { color:var(--brand); }

    /* balance bars */
    .balbar { margin:14px 0; display:flex; flex-direction:column; gap:8px; }
    .balrow { display:flex; align-items:center; gap:10px; }
    .bl { width:36px; font-size:13px; color:var(--muted); }
    .bv { width:60px; text-align:right; font-size:13px; font-variant-numeric:tabular-nums; }
    .track { flex:1; height:16px; background:var(--bg); border-radius:8px; overflow:hidden; border:1px solid var(--line); }
    .fill { height:100%; border-radius:8px; }
    .fill.intake { background:linear-gradient(90deg,#f6c453,#e0564f); }
    .fill.burn { background:linear-gradient(90deg,#67b26f,#2bb3a3); }
    .fill.target { background:linear-gradient(90deg,#4a90d9,#3a7bd5); }
    /* 摂取の状態色（消費以内=青 / 近い=黄 / 超過=赤） */
    .fill.tone-info { background:var(--info); }
    .fill.tone-warn { background:var(--warn); }
    .fill.tone-bad  { background:var(--bad); }

    /* nutrient bars */
    .nut { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
    .nut-row { display:grid; grid-template-columns:80px 1fr auto; gap:10px; align-items:center; }
    .nut-l { font-size:13px; }
    .nut-track { position:relative; height:12px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    .nut-fill { height:100%; border-radius:6px; }
    .nut-fill.good { background:var(--good); } .nut-fill.warn { background:var(--warn); } .nut-fill.bad { background:var(--bad); }
    .nut-v { font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

    /* PFC */
    .pfc-bar { display:flex; height:22px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
    .pfc-seg.p { background:#e0564f; } .pfc-seg.f { background:#f6c453; } .pfc-seg.c { background:#4a90d9; }
    .pfc-legend { display:flex; gap:16px; flex-wrap:wrap; margin:8px 0; font-size:13px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
    .dot.p { background:#e0564f; } .dot.f { background:#f6c453; } .dot.c { background:#4a90d9; }
    .dot.br { background:#f6c453; } .dot.lu { background:#67b26f; } .dot.di { background:#4a90d9; } .dot.sn { background:#c56cf0; }
    .line { display:inline-block; width:16px; height:0; border-top:2px solid; margin-right:5px; vertical-align:middle; }
    .line.burn { border-color:#e0564f; } .line.wt { border-color:#2bb3a3; border-top-style:dashed; }
    .line.tgt { border-color:#3a7bd5; border-top-style:dashed; }
    .line.avgburn { border-color:#e0564f; border-top-style:dotted; }

    /* advice */
    .advice-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .advice-item:last-child { border-bottom:none; }
    .advice-item.good { }.advice-item.bad .ai-icon{}
    .ai-icon { flex:0 0 auto; }

    /* chart */
    .seg { display:flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .seg-btn { border:none; background:transparent; color:var(--muted); padding:7px 14px; cursor:pointer; font-size:13px; font-weight:600; }
    .seg-btn.active { background:var(--brand); color:#fff; }
    .chart-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:8px 0; }
    .chart-wrap { touch-action:pan-y; }
    canvas { width:100%; display:block; margin-top:6px; }
    .chart-tip { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
      font-size:12.5px; color:var(--ink); margin:6px 0; min-height:20px; line-height:1.5; }
    .chart-tip small { color:var(--muted); }

    /* chips */
    .chips { list-style:none; padding:0; display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
    .chip { background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:4px 6px 4px 12px; font-size:13px; }
    .ex-add { margin-top:10px; }

    /* boxes */
    .warn-box { background:rgba(217,140,23,.12); border:1px solid var(--warn); border-radius:10px; padding:10px; font-size:13px; margin-top:10px; }
    .good-box { background:rgba(46,158,91,.12); border:1px solid var(--good); border-radius:10px; padding:10px; font-size:13px; }
    .loading { color:var(--info); }

    /* modal */
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
    .modal { background:var(--card); width:100%; max-width:520px; border-radius:18px 18px 0 0; max-height:85vh; display:flex; flex-direction:column; }
    @media (min-width:600px){ .modal-bg{ align-items:center; } .modal{ border-radius:18px; } }
    .modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
    .modal-head h3 { margin:0; }
    .modal-x { font-size:24px; line-height:1; color:var(--muted); }
    .modal-body { padding:16px 18px; overflow-y:auto; }
    .fp-list { display:flex; flex-direction:column; gap:6px; margin-top:12px; max-height:52vh; overflow-y:auto; }
    .fp-item { display:flex; justify-content:space-between; align-items:center; padding:11px 12px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); color:var(--ink); cursor:pointer; text-align:left; }
    .fp-item:hover { border-color:var(--brand); }
    .fp-name { display:flex; flex-direction:column; font-size:14px; }
    .fp-name small { color:var(--muted); font-size:11px; }
    .fp-k { color:var(--brand); font-weight:600; }

    .filedrop { display:block; text-align:center; padding:22px; border:2px dashed var(--line); border-radius:12px;
      cursor:pointer; margin:12px 0; color:var(--muted); }
    .filedrop:hover { border-color:var(--info); color:var(--info); }
    .ph-img { width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin:10px 0; }
    .ph-card { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
    .ph-macros { font-size:12px; color:var(--muted); margin:4px 0; }
    /* AIチャット */
    .chat-log { max-height:52vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
      margin-top:12px; padding:10px; background:var(--bg); border:1px solid var(--line); border-radius:12px; }
    .msg { padding:9px 12px; border-radius:12px; font-size:14px; max-width:88%; white-space:normal; line-height:1.6; }
    .msg.user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
    .msg.assistant { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
    #ch-input { flex:1; }

    /* 未記録リマインダー */
    .nudge { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13.5px;
      background:rgba(217,140,23,.12); border:1px solid var(--warn); border-radius:10px; padding:10px 12px; margin-bottom:12px; }

    /* レポート */
    .report-view { font-size:13.5px; }
    .report-view h2 { font-size:17px; margin:0 0 4px; }
    .report-view h3 { font-size:14px; margin:16px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--line); }
    .rp-sub { color:var(--muted); font-size:12px; margin:0 0 8px; }
    .rp-tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .rp-tbl th, .rp-tbl td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
    .rp-tbl th { color:var(--muted); font-weight:600; white-space:nowrap; }
    .rp-days td, .rp-days th { font-variant-numeric:tabular-nums; }
    .rp-list { margin:6px 0 0 20px; padding:0; font-size:13px; }
    .rp-note { color:var(--muted); font-size:11.5px; margin-top:14px; }
    #report-print { display:none; }
    @media print {
      #app, .modal-bg { display:none !important; }
      #report-print { display:block !important; padding:16px; color:#000; background:#fff; font-size:12px; }
      #report-print h2 { font-size:16px; } #report-print h3 { font-size:13px; margin:14px 0 5px; border-bottom:1px solid #ccc; }
      #report-print table { width:100%; border-collapse:collapse; }
      #report-print th, #report-print td { border-bottom:1px solid #ddd; padding:4px 6px; text-align:left; }
      body { background:#fff; }
    }

    .urlbox { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
      font-size:12px; word-break:break-all; font-family:ui-monospace,monospace; }
    code { background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:12px; word-break:break-all; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="data.js?v=29"></script>
  <script src="app.js?v=29"></script>
</body>
</html>
